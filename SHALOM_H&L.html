<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shalom H&L · Inventario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ShalomCSS.css">
</head>
<body>

<div class="app">

  <!-- ===================== SIDEBAR ===================== -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">SH</span>
      <div class="brand-text">
        <strong>Shalom H&amp;L</strong>
        <small>Panel de inventario</small>
      </div>
    </div>

    <nav class="nav" id="mainNav">
      <button class="nav-item active" data-page="dashboard">
        <span class="nav-icon">🏠</span> Panel general
      </button>
      <button class="nav-item" data-page="inventario">
        <span class="nav-icon">📦</span> Inventario
      </button>
      <button class="nav-item" data-page="ventas">
        <span class="nav-icon">🛍️</span> Ventas
      </button>
      <button class="nav-item" data-page="entradas">
        <span class="nav-icon">📥</span> Entradas
      </button>
      <button class="nav-item" data-page="reponer">
        <span class="nav-icon">⚠️</span> Por reponer
        <span class="nav-badge" id="badgeReponer" hidden>0</span>
      </button>
      <button class="nav-item" data-page="agotados">
        <span class="nav-icon">❌</span> Agotados
        <span class="nav-badge" id="badgeAgotados" hidden>0</span>
      </button>
      <button class="nav-item" data-page="reportes">
        <span class="nav-icon">📊</span> Reportes
      </button>
      <button class="nav-item" data-page="configuracion">
        <span class="nav-icon">⚙️</span> Configuración
      </button>
    </nav>

    <div class="sidebar-foot">
      <p>Datos guardados en este navegador</p>
    </div>
  </aside>

  <!-- ===================== MAIN ===================== -->
  <div class="main">

    <!-- TOP BAR -->
    <header class="topbar">
      <div class="search-wrap">
        <span class="search-icon">🔎</span>
        <input type="text" id="globalSearch" placeholder="Buscar productos, códigos, categorías o ventas…" autocomplete="off">
        <div class="search-results" id="searchResults" hidden></div>
      </div>

      <div class="topbar-actions">
        <div class="bell-wrap">
          <button class="icon-btn" id="bellBtn" aria-label="Notificaciones">
            🔔
            <span class="bell-dot" id="bellDot" hidden></span>
          </button>
          <div class="bell-panel" id="bellPanel" hidden>
            <div class="bell-panel-head">Notificaciones</div>
            <div id="bellList" class="bell-list"></div>
          </div>
        </div>

        <div class="user-chip">
          <span class="avatar">U</span>
          <div class="user-chip-text">
            <strong>Usuario</strong>
            <small>Administrador</small>
          </div>
        </div>
      </div>
    </header>

    <!-- PAGE CONTENT -->
    <main class="content" id="content">
      <!-- Las páginas se renderizan aquí dinámicamente desde app.js -->
    </main>
  </div>
</div>

<!-- ===================== MODAL: PRODUCTO ===================== -->
<div class="modal-overlay" id="productModalOverlay" hidden>
  <div class="modal">
    <div class="modal-head">
      <h3 id="productModalTitle">Agregar prenda</h3>
      <button class="modal-close" data-close="productModalOverlay">✕</button>
    </div>
    <form id="productForm" class="modal-body form-grid" novalidate>
      <input type="hidden" id="p_id">

      <label class="field">
        <span>Código *</span>
        <input type="text" id="p_code" required placeholder="Ej. SHL-0012">
      </label>

      <label class="field">
        <span>Nombre de la prenda *</span>
        <input type="text" id="p_name" required placeholder="Ej. Vestido floral">
      </label>

      <label class="field">
        <span>Categoría *</span>
        <select id="p_category" required>
          <option value="">Selecciona…</option>
          <option>Blusas</option>
          <option>Camisas</option>
          <option>Pantalones</option>
          <option>Jeans</option>
          <option>Faldas</option>
          <option>Vestidos</option>
          <option>Chaquetas</option>
          <option>Sacos</option>
          <option>Conjuntos</option>
          <option>Ropa deportiva</option>
          <option>Accesorios</option>
        </select>
      </label>

      <label class="field">
        <span>Subcategoría</span>
        <input type="text" id="p_subcategory" placeholder="Ej. Manga larga">
      </label>

      <label class="field">
        <span>Marca</span>
        <input type="text" id="p_brand" placeholder="Ej. Shalom Basics">
      </label>

      <label class="field">
        <span>Color *</span>
        <input type="text" id="p_color" required placeholder="Ej. Rosado">
      </label>

      <label class="field">
        <span>Talla *</span>
        <input type="text" id="p_size" required placeholder="Ej. M">
      </label>

      <label class="field">
        <span>Material</span>
        <input type="text" id="p_material" placeholder="Ej. Algodón">
      </label>

      <label class="field">
        <span>Precio de compra (COP) *</span>
        <input type="number" id="p_purchasePrice" min="0" step="1000" required>
      </label>

      <label class="field">
        <span>Precio de venta (COP) *</span>
        <input type="number" id="p_salePrice" min="0" step="1000" required>
      </label>

      <label class="field">
        <span>Stock actual *</span>
        <input type="number" id="p_stock" min="0" step="1" required>
      </label>

      <label class="field">
        <span>Stock mínimo *</span>
        <input type="number" id="p_minStock" min="0" step="1" required>
      </label>

      <label class="field">
        <span>Proveedor</span>
        <input type="text" id="p_supplier" placeholder="Ej. Textiles Andinos">
      </label>

      <label class="field">
        <span>Fecha de ingreso</span>
        <input type="date" id="p_entryDate">
      </label>

      <label class="field">
        <span>Estado</span>
        <select id="p_status">
          <option>Activo</option>
          <option>Descontinuado</option>
          <option>En pedido</option>
        </select>
      </label>

      <label class="field">
        <span>Imagen (URL)</span>
        <input type="text" id="p_image" placeholder="https://…">
      </label>

      <p class="field-hint">* Campos obligatorios</p>
    </form>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close="productModalOverlay">Cancelar</button>
      <button class="btn btn-primary" id="saveProductBtn">Guardar prenda</button>
    </div>
  </div>
</div>

<!-- ===================== MODAL: VENTA ===================== -->
<div class="modal-overlay" id="saleModalOverlay" hidden>
  <div class="modal">
    <div class="modal-head">
      <h3>Registrar venta</h3>
      <button class="modal-close" data-close="saleModalOverlay">✕</button>
    </div>
    <form id="saleForm" class="modal-body form-grid" novalidate>
      <label class="field field-wide">
        <span>Producto *</span>
        <select id="s_product" required></select>
      </label>

      <label class="field">
        <span>Stock disponible</span>
        <input type="text" id="s_stockInfo" disabled>
      </label>

      <label class="field">
        <span>Cantidad *</span>
        <input type="number" id="s_quantity" min="1" step="1" required value="1">
      </label>

      <label class="field">
        <span>Precio unitario (COP) *</span>
        <input type="number" id="s_unitPrice" min="0" step="1000" required>
      </label>

      <label class="field">
        <span>Descuento (COP)</span>
        <input type="number" id="s_discount" min="0" step="1000" value="0">
      </label>

      <label class="field">
        <span>Método de pago *</span>
        <select id="s_payment" required>
          <option>Efectivo</option>
          <option>Tarjeta</option>
          <option>Transferencia</option>
          <option>Otro</option>
        </select>
      </label>

      <label class="field">
        <span>Vendedor *</span>
        <input type="text" id="s_seller" required placeholder="Ej. Leidy Maldonado">
      </label>

      <div class="field field-wide sale-total-box">
        <span>Total de la venta</span>
        <strong id="s_totalPreview">$0</strong>
      </div>
    </form>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close="saleModalOverlay">Cancelar</button>
      <button class="btn btn-primary" id="saveSaleBtn">Registrar venta</button>
    </div>
  </div>
</div>

<!-- ===================== MODAL: ENTRADA ===================== -->
<div class="modal-overlay" id="entryModalOverlay" hidden>
  <div class="modal">
    <div class="modal-head">
      <h3>Registrar entrada de mercancía</h3>
      <button class="modal-close" data-close="entryModalOverlay">✕</button>
    </div>
    <form id="entryForm" class="modal-body form-grid" novalidate>
      <label class="field">
        <span>Fecha de entrada *</span>
        <input type="date" id="e_date" required>
      </label>

      <label class="field">
        <span>Proveedor *</span>
        <input type="text" id="e_supplier" required>
      </label>

      <label class="field field-wide">
        <span>Producto *</span>
        <select id="e_product" required></select>
      </label>

      <label class="field">
        <span>Cantidad recibida *</span>
        <input type="number" id="e_quantity" min="1" step="1" required>
      </label>

      <label class="field">
        <span>Precio de compra (COP) *</span>
        <input type="number" id="e_purchasePrice" min="0" step="1000" required>
      </label>

      <label class="field">
        <span>N.º de factura / referencia</span>
        <input type="text" id="e_invoice" placeholder="Ej. FAC-2026-045">
      </label>

      <label class="field field-wide">
        <span>Observaciones</span>
        <textarea id="e_notes" rows="2" placeholder="Opcional"></textarea>
      </label>
    </form>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close="entryModalOverlay">Cancelar</button>
      <button class="btn btn-primary" id="saveEntryBtn">Registrar entrada</button>
    </div>
  </div>
</div>

<!-- ===================== MODAL: DETALLES (genérico) ===================== -->
<div class="modal-overlay" id="detailsModalOverlay" hidden>
  <div class="modal">
    <div class="modal-head">
      <h3 id="detailsTitle">Detalles</h3>
      <button class="modal-close" data-close="detailsModalOverlay">✕</button>
    </div>
    <div class="modal-body" id="detailsBody"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close="detailsModalOverlay">Cerrar</button>
    </div>
  </div>
</div>

<!-- ===================== MODAL: CONFIRMACIÓN ===================== -->
<div class="modal-overlay" id="confirmModalOverlay" hidden>
  <div class="modal modal-sm">
    <div class="modal-head">
      <h3>Confirmar acción</h3>
      <button class="modal-close" data-close="confirmModalOverlay">✕</button>
    </div>
    <div class="modal-body">
      <p id="confirmMessage">¿Seguro que deseas continuar?</p>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close="confirmModalOverlay">Cancelar</button>
      <button class="btn btn-danger" id="confirmActionBtn">Sí, eliminar</button>
    </div>
  </div>
</div>

<!-- TOASTS -->
<div class="toast-stack" id="toastStack"></div>

<script src="ShalomJS.js"></script>
</body>
</html>
